# Kanagawa Wave tmux palette overrides.
setw -g window-status-activity-style 'fg=#e6c384,bg=default'
# set -g pane-active-border-style 'fg=#1f1f28,bg=#1f1f28'  # fully invisible
# set -g pane-border-style 'fg=#1f1f28,bg=#1f1f28'        # fully invisible
# set -g pane-active-border-style 'fg=#957FB8'             # oni violet all borders
# set -g pane-border-style 'fg=#2A2A37'                    # subtle grey all borders
# All borders invisible — bottom bar comes from pane-border-format fill only
# Side borders will be invisible, bottom bar has a 1-char gap at edges (tmux limitation)
set -g pane-active-border-style 'fg=#1f1f28'
set -g pane-border-style 'fg=#1f1f28'
set -g status-bg default
set -g status-fg '#dcd7ba'
set -g @minimal-tmux-bg '#e6c384'
set -g @minimal-tmux-fg '#1f1f28'

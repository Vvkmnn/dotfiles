# Auto-restore sessions on tmux start, save pane scrollback
set -g @continuum-restore 'on'
set -g @continuum-save-interval '7'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-delete-backup-after '7'

# Lazy restore: clear default process list (vi vim nvim emacs man less top htop...)
# so nothing auto-launches on restore — prevents overheating from 12+ simultaneous processes
# Processes only start when user presses Enter in each pane
set -g @resurrect-default-processes ''
# claude: smart resume via session ID mapping (falls back to --continue)
# nvim: lazy wrapper passes original args via * token (e.g. nvim TODO.md)
# everything else: plain shell at correct directory
set -g @resurrect-processes '"~claude->~/.config/tmux/claude-session-restore.sh" "~nvim->~/.config/tmux/lazy-run.sh nvim *"'
# Restore nvim sessions via persistence.nvim (auto-saves to ~/.local/state/nvim/sessions/)
# resurrect launches `nvim -S` if Session.vim exists in cwd, otherwise plain nvim
# persistence.nvim keybind: <leader>qs to restore buffers/layout after nvim opens
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'fcsonline/tmux-thumbs'
# thumbs default is Space (hijacks our binding)
# using t replaces clock-mode (C-a t) - use `date` command if needed
set -g @thumbs-key t
unbind t  # remove clock-mode to ensure thumbs gets it

set -g @plugin 'wfxr/tmux-fzf-url'


# navigation
# NOTE add -r if want to repeat
# bind -r h select-pane -L
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# switch panes
bind-key -r Tab select-pane -t :.+

# join and remove panes

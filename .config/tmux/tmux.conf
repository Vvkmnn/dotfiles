# Arrow keys scroll in copy-mode (j/k still move cursor, J/K also scroll)
bind-key -T copy-mode-vi Up send-keys -X scroll-up
bind-key -T copy-mode-vi Down send-keys -X scroll-down

# Viewport scrolling in copy-mode (single keys: J/K push screen down/up)
bind-key -T copy-mode-vi J set-option -pq @auto_scroll off \; send-keys -X scroll-up     # Stop auto-scroll + push screen up
bind-key -T copy-mode-vi K set-option -pq @auto_scroll off \; send-keys -X scroll-down   # Stop auto-scroll + push screen down

# Claude marker navigation in copy-mode (no prefix needed, zero-latency)
bind-key -T copy-mode-vi [ send-keys -X search-backward "^⏺"
bind-key -T copy-mode-vi ] send-keys -X search-forward "^⏺"

# Clipboard via OSC 52 — zero forks (replaces tmux-yank's copy-pipe-and-cancel)
# set-clipboard on sends OSC 52 escape -> Ghostty clipboard-write=allow -> system clipboard
# -no-clear: copy to buffer + system clipboard, stay in copy mode (q/Escape to exit)
bind-key -T copy-mode-vi y send-keys -X copy-selection-no-clear
# Enter unbound in copy-mode-vi — never visibly worked, y handles yanking
unbind-key -T copy-mode-vi Enter
# Exit copy-mode: also stop any auto-scroll (belt+suspenders with loop's pane_in_mode check)
bind-key -T copy-mode-vi q set-option -pq @auto_scroll off \; send-keys -X cancel
bind-key -T copy-mode-vi Escape set-option -pq @auto_scroll off \; send-keys -X cancel
# Mouse stops auto-scroll (same pattern as q/Escape/J/K)
bind-key -T copy-mode-vi MouseDown1Pane set-option -pq @auto_scroll off \; select-pane
bind-key -T copy-mode-vi WheelUpPane set-option -pq @auto_scroll off \; select-pane \; send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane set-option -pq @auto_scroll off \; select-pane \; send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane set-option -pq @auto_scroll off \; select-pane \; send-keys -X select-word \; send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi TripleClick1Pane set-option -pq @auto_scroll off \; select-pane \; send-keys -X select-line \; send-keys -X copy-selection-no-clear


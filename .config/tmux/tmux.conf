# Optimized TPM loading - defer non-critical operations for faster startup
run '~/.tmux/plugins/tpm/tpm'
# Background plugin management - keeps startup fast
run-shell 'tmux new-session -d -s tpm_update "~/.tmux/plugins/tpm/bin/update_plugins all; ~/.tmux/plugins/tpm/bin/clean_plugins" >/dev/null 2>&1 || true'

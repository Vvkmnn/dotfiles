### tmux

## options
set-option -g default-terminal 'xterm-ghostty'
set-option -g terminal-overrides ',xterm-256color:RGB,xterm-ghostty:RGB'
set-option -a terminal-features ',xterm-256color:RGB'
set-option -as terminal-features ',xterm-ghostty:hyperlinks'
set-option -as terminal-features ',*:hyperlinks'
set-option -gw xterm-keys on

# Modern keyboard protocol (CSI-u) — only sent when apps request it (Neovim does natively)
# Enables Shift+Enter, Ctrl+;, Ctrl+, etc. inside tmux. Safe: apps that don't request it are unaffected.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# Propagate Ghostty env into tmux sessions — needed for terminfo, shell integration, and TERM detection
set-option -ga update-environment GHOSTTY_RESOURCES_DIR
set-option -ga update-environment GHOSTTY_SHELL_FEATURES
set-option -ga update-environment GHOSTTY_BIN_DIR
set-option -ga update-environment TERM_PROGRAM

set-window-option -g automatic-rename on # Automatically set window title
set-option -g set-titles on
# Smart window naming — zero forks, pure tmux format (no #() shell expansion)
# Digit-prefixed command (Claude process.title = version like "2.1.50") -> "claude"
# "codex*" command -> "codex"
# Everything else -> lowercased via 26 chained #{s|A|a|} substitutions
#
# SAFETY: Never use #() in automatic-rename-format. tmux's job_* fork infrastructure
# has a SIGSEGV bug (job_get_event null deref, "crashed on child side of fork pre-exec").
# Crash report: ~/Library/Logs/DiagnosticReports/tmux-2026-02-21-115812.ips
# tmux maintainer advises against #() here: https://github.com/tmux/tmux/issues/4316
# Related fork SIGSEGV: https://github.com/tmux/tmux/issues/3206
#
# PREVIOUSLY (DANGEROUS — DO NOT RE-ENABLE):
# set-option -g automatic-rename-format '#{?#{m:[0-9]*,#{pane_current_command}},claude,#{?#{m:codex*,#{pane_current_command}},codex,#{?#{m:Python*,#{pane_current_command}},python,#(printf %s "#{pane_current_command}" | tr A-Z a-z)}}}'
# Window name: "claude|.alfred" — Raycast Tmux Sessioner prepends session:index
# Using | as separator (ASCII-safe for Raycast, not : which Tmux Sessioner splits on)
# #{b:pane_current_path} is safe — pure tmux format, no #() shell fork (see SAFETY above)
# Note: | appears in the s||| substitutions below but those use paired delimiters, no conflict
# Window name for Raycast: "claude (~/.alfred)" — full tilde path in parens
# tmux status bar shows "7|claude|.alfred" via window-status-format (renders differently)
set-option -g automatic-rename-format '#{?#{m:[0-9]*,#{pane_current_command}},claude,#{?#{m:codex*,#{pane_current_command}},codex,#{s|A|a|;s|B|b|;s|C|c|;s|D|d|;s|E|e|;s|F|f|;s|G|g|;s|H|h|;s|I|i|;s|J|j|;s|K|k|;s|L|l|;s|M|m|;s|N|n|;s|O|o|;s|P|p|;s|Q|q|;s|R|r|;s|S|s|;s|T|t|;s|U|u|;s|V|v|;s|W|w|;s|X|x|;s|Y|y|;s|Z|z|:pane_current_command}}} (#{s|/Users/v|~|:pane_current_path})'

set -g base-index 0
setw -g pane-base-index 0
set -g mouse on
# Disable right-click context menu to prevent accidental splits
unbind -T root MouseDown3Pane        # disable right-click menu
unbind -T root M-MouseDown3Pane      # disable alt+right-click menu
# DISABLED: smcup@:rmcup@ causes buffer bouncing when Claude Code redraws (known bug #1913).
# This hack allowed scrolling through vim/less output after exiting, but programs
# like Claude that redraw frequently pollute the scrollback buffer, causing visual bounce.
# Re-enabling alternate screen isolates program output from main scrollback.
# set -g terminal-overrides ',*:smcup@:rmcup@'
# detach-on-destroy: off=switch to another session when current closes, on=detach client
set -g detach-on-destroy off
# exit-empty: off=server stays alive with 0 sessions (survives crashes), on=server exits when empty
set -s exit-empty off
# VS Code's terminal drops OSC replies when escape-time is 0; give it headroom.
if-shell '[ "$TERM_PROGRAM" = "vscode" ]' \
  'set -g escape-time 10' \
  'set -g escape-time 0'
set -g history-limit 100000      # increase history size (from 2,000)
# set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g repeat-time 300             # 300ms repeat window for -r bindings (was 1000ms)
# Allow OSC sequences (10/11/52 etc.) to pass through so VS Code/xterm.js handle colour queries cleanly.
set -g allow-passthrough all
set -g status-position top       # macOS / darwin style
set -g status-interval 30        # update status bar every 30s (reduces morbid_year script calls)
# escape-time already set above
# default-terminal set at top of file
setw -g mode-keys vi
set -g status-keys vi
set -g monitor-activity on        # if change show in command line
set -g activity-action other      # don't switch to window on activity
setw -g window-status-activity-style 'fg=#7aa2f7,bg=default'  # blue text when activity

# Bell notification (triggered by notification.js hook when Claude needs attention)
# Default window-status-bell-style is 'reverse' (white box) - attention-grabbing
# Bell should auto-clear when switching to that window (bell-action any)
# If bell gets stuck: tmux refresh-client -S


# Pane labels: bottom-right badge, hidden when only 1 pane
set -g pane-border-status bottom
set -g pane-border-format '#{?#{e|>:#{window_panes},1},#[align=right]#{?pane_active,#[fg=#957FB8 bg=#957FB8]━━━━━━━━━━━━━━━━━━━#[fg=#1f1f28 bg=#957FB8 bold] #{pane_index}│#{?#{m:[0-9]*,#{pane_current_command}},claude,#{pane_current_command}} #[default],#[fg=#54546D bg=#54546D]━━━━━━━━#[fg=#1f1f28 bg=#54546D] #{pane_index}│#{?#{m:[0-9]*,#{pane_current_command}},claude,#{pane_current_command}} #[default]},}'
set -g pane-active-border-style 'fg=#957FB8'
set -g pane-border-style 'fg=#2A2A37'
set -g status-bg default
set -g status-fg white

# Theme colors sourced from ~/.theme
if-shell "[ -f $HOME/.theme/tmux/kanagawa-wave.conf ]" {
  source-file "$HOME/.theme/tmux/kanagawa-wave.conf"
}



# Find link And open
# https://www.reddit.com/r/tmux/comments/sv6skh/comment/hxj5zq4/?utm_source=share&utm_medium=web3x&utm_name=web3xcss&utm_term=1&utm_content=share_button
bind-key C-o run-shell -b "tmux capture-pane -J -p | grep -oE '(https?):\/\/.*[^>]' | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open" # \; display-message "Config reloaded..."

## keybinds
# prefix - C-a (classic screen style), C-b as backup
# Tried C-Space — kept reverting to C-a due to muscle memory + Karabiner setup
# set -g prefix C-Space
set -g prefix C-a
# C-a a = smart last window (double-tap feel)
# (replaces send-prefix for literal C-a - use Home key for beginning of line instead)
# prefix+a = toggle back to last session (with its active window preserved)
bind-key a switch-client -l
# prefix2 disabled — C-b conflicts with Claude Code's "run in background" shortcut
# set -g prefix2 C-b
# bind-key C-b send-prefix -2

# prefix + e = fuzzy window search (explore) across all sessions
# Was prefix + Space when prefix was C-a — Ctrl+Space Space was awkward
# `e` chosen because it's the only letter with no tmux default and no other user binding
# bind-key Space display-popup -w 95% -h 90% -E "~/.config/tmux/tmux.sh finder"
bind-key e display-popup -w 95% -h 90% -E "~/.config/tmux/tmux.sh finder"

# learn defaults
# Prefix-() tab between sessions
# Prefix-S interactive nav between sessions
# Prefix-np next previous windows

# Beautiful consolidated move-window chooser - search all windows or create new session
bind-key m display-popup -w 88% -h 88% -E "bash ~/.config/tmux/smart_move_window.sh"

# Test choose-tree for move (compare with fzf script)
bind-key M choose-tree -Zw "run-shell 'bash ~/.config/tmux/move_window_to_target.sh \"%%\"'"


# navigation
# Session and window navigation (hjkl)
# ── prefix+hjkl: vim-consistent navigation ──────────────────────────────
# h/l = left/right = previous/next window  (horizontal in status bar)
# j/k = down/up    = next/previous session (vertical stacking)
#
# Previous approach (h/l=sessions, j/k=windows — swapped axes):
# bind -r h switch-client -p  # Previous session
# bind -r l switch-client -n  # Next session
# bind -r j run-shell -b '... previous-window ...'
# bind -r k run-shell -b '... next-window ...'
#
# Even older (plain window-only, no sessions):
# bind -r h previous-window
# bind -r l next-window

bind -r h run-shell -b 'tmux display-message -p "#{pane_in_mode}" | grep -q 1 && tmux send-keys -X cancel; tmux previous-window || true'
bind -r l run-shell -b 'tmux display-message -p "#{pane_in_mode}" | grep -q 1 && tmux send-keys -X cancel; tmux next-window || true'
bind -r j switch-client -n
bind -r k switch-client -p

# Move window across sessions (prefix+Up/Down)
bind Up run-shell -b 'cur="#{session_name}"; target="$(tmux list-sessions -F "##{session_name}" | grep -B1 "^$cur$" | head -1)"; [ "$target" = "$cur" ] && target="$(tmux list-sessions -F "##{session_name}" | tail -1)"; [ "$target" != "$cur" ] && tmux move-window -a -t "$target:" && tmux switch-client -t "$target"'
bind Down run-shell -b 'cur="#{session_name}"; target="$(tmux list-sessions -F "##{session_name}" | grep -A1 "^$cur$" | tail -1)"; [ "$target" = "$cur" ] && target="$(tmux list-sessions -F "##{session_name}" | head -1)"; [ "$target" != "$cur" ] && tmux move-window -a -t "$target:" && tmux switch-client -t "$target"'
bind -r J set-option -pq @auto_scroll off \; copy-mode -e \; send-keys -X scroll-up     # Stop auto-scroll + scroll up
bind -r K set-option -pq @auto_scroll off \; copy-mode -e \; send-keys -X scroll-down   # Stop auto-scroll + scroll down

# Pane splits (| = side-by-side, - = stacked), inherit CWD
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Note: C-a a already bound to smart_last_window.sh for last active window (line 58)

# Jump back to previous Claude marker (user prompt or action bullet) - claude-jump
# Cross-ref: Neovim version in ~/.config/nvim/lua/plugins/custom.lua (search "claude-jump")
# Searches for: user prompts (^> ) OR Claude action bullets (^⏺)
# Toggle behavior: in copy-mode = cancel, not in copy-mode = search
# Use 'n' in copy-mode to jump to next (earlier) match
bind-key b run-shell -b "bash ~/.config/tmux/claude_jump_toggle.sh"
bind-key [ set-option -pq @auto_scroll off \; copy-mode \; send-keys -X search-backward "^⏺"
bind-key ] set-option -pq @auto_scroll off \; copy-mode \; send-keys -X search-forward "^⏺"

# Branch Claude: current pane = branch, new pane = original (focused)
bind-key B run-shell -b "bash ~/.config/tmux/claude-branch-pane.sh --pane #{pane_id}"
# Claude session history: fzf picker with preview, resume or jump to active
bind-key g display-popup -E -w 95% -h 85% "$HOME/.config/fzf/clh.sh --inline"
bind-key v run-shell -b "~/.config/tmux/tmux.sh follow"
bind-key H run-shell -b "~/.config/tmux/tmux.sh auto-scroll up"
bind-key L run-shell -b "~/.config/tmux/tmux.sh auto-scroll down"

# Vim-style search: / opens prompt, n/N navigate, wraps around
bind-key / copy-mode \; command-prompt -T search -p "/" "send-keys -X search-backward \"%%\""

# Smart pane switching with awareness of Vim splits (refs: https://github.com/alexghergh/nvim-tmux-navigation#tmux,
# https://github.com/christoomey/vim-tmux-navigator#readme)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|n?vim?x?)(diff)?$'"

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

# Standard vim directions: h=left, j=down, k=up, l=right
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n C-\\ if-shell \"$is_vim\" 'send-keys C-\\' 'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n C-\\ if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"
bind-key -n C-Space if-shell "$is_vim" "send-keys C-Space" "select-pane -t:.+"


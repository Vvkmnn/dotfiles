# Quick new session
bind-key N new-session

# New window right after current (not at end)
bind-key c new-window -a -c "#{pane_current_path}"

# prefix + C — open persistent Claude Code session on the mini (vMiniM4) in a new window
# Same wrapper as skhd ctrl+cmd-m. Detach (prefix d) leaves the mini's tmux running.
bind-key C new-window -a -n "claude@mini" "exec /Users/v/.local/bin/claude-mini"

# NOTE (fleet keybindings deferred): j/jc/jv work as shell COMMANDS first (~/.functions).
# Wire prefix-j picker + prefix-R (/remote-control) + repoint prefix-C/skhd once verified.

# Arrow keys for moving windows (reordering, wraps around)
# Explicit edge check — swap-window +1/-1 wraps silently instead of failing
bind-key Left run-shell 'cur="#{window_index}"; first=$(tmux list-windows -F "##{window_index}" | head -1); if [ "$cur" = "$first" ]; then tmux move-window -a -t "$(tmux list-windows -F "##{window_index}" | tail -1)"; else tmux swap-window -t -1 && tmux select-window -t -1; fi'
bind-key Right run-shell 'cur="#{window_index}"; last=$(tmux list-windows -F "##{window_index}" | tail -1); if [ "$cur" = "$last" ]; then tmux move-window -b -t "$(tmux list-windows -F "##{window_index}" | head -1)"; else tmux swap-window -t +1 && tmux select-window -t +1; fi'

# bind-key r source-file "~/.config/tmux/tmux.conf" # reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded..."

# Global toggle for OpenCode pane: if in Neovim send <C-.>, otherwise jump back (ref: https://github.com/NickvanDyke/opencode.nvim#provider)
bind-key -n C-. if-shell "$is_vim" "send-keys C-." "select-pane -l"


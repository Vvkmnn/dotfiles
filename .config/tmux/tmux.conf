# learn defaults
# Prefix-() tab between sessions
# Prefix-S interactive nav between sessions
# Prefix-np next previous windows

# Beautiful consolidated move-window chooser - search all windows or create new session
bind-key m display-popup -w 88% -h 88% -E "bash ~/.config/tmux/smart_move_window.sh"


set-hook -g client-session-changed "run-shell -b 'bash ~/.config/tmux/random_animal.sh'"

# Invalidate statusline cache on focus-in (e.g., after sleep/wake).
# Guard: only invalidate if cache mtime is already past TTL (>=900s).
# Without guard, every Cmd-Tab would trigger an API call (~20/hour vs limit of ~10).
set -g focus-events on
set-hook -g client-focus-in 'run-shell -b "c=$HOME/.claude/status/rate_limit.json; [ -f $c ] && [ $(($(date +%s) - $(stat -f %m $c))) -ge 900 ] && touch -t 197001010000 $c 2>/dev/null; true"'

# Idle-session sweep — reaps ONLY detached, single-window, plain-zsh sessions idle 7h+
# (never touches anything attached, multi-window, or running a program). See
# prune_idle_sessions.sh for the full safety-predicate breakdown. Fires on session
# creation (this workflow's natural cadence — new-session-per-window means it runs
# often) rather than the render path, so it can never contribute to a fork crash.
set-hook -g session-created "run-shell -b 'bash ~/.config/tmux/prune_idle_sessions.sh'"

# Machine badge — assign each new session its per-session colour shade, and
# re-assert the badge on attach (beats the async plugin load on a fresh server).
# Array indices [1] add a second command to these hooks without clobbering the
# prune (session-created) / random_animal (client-session-changed) hooks above.
set-hook -g session-created[1] "run-shell -b 'bash ~/.config/tmux/machine_badge.sh'"
set-hook -g client-attached "run-shell -b 'bash ~/.config/tmux/machine_badge.sh'"


# set -g @minimal-tmux-indicator-str "[#(TZ="America/New_York" kate +"%%Y-%%m-%%d %%H:%%M")]"
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "top"

# Enables or disables the left and right status bar
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true

# expanded icon (fullscreen icon)
set -g @minimal-tmux-expanded-icon " 󰊓 "

#on all tabs (default is false)
# false will make it visible for the current tab only
set -g @minimal-tmux-show-expanded-icons-for-all-tabs true

## tmux-fzf
# set -g @plugin 'sainnhe/tmux-fzf'  # Using custom fzf window search instead

# Enhanced window search with rich context for MCP (prefix + Enter)
# Using tmux-fzf plugin instead - invoke with prefix+F
# bind-key Enter display-popup -w 88% -h 88% -E "~/.config/tmux/tmux.sh finder"


# TPM loading + deferred background update (delay lets continuum restore finish first)
run '~/.config/tmux/plugins/tpm/tpm'
# Deferred update only — no clean_plugins (too aggressive, can wipe plugins if config parsing fails)
run-shell '(sleep 10; ~/.config/tmux/plugins/tpm/bin/update_plugins all) >/dev/null 2>&1 &'

# Re-run the badge AFTER TPM: the minimal plugin sets window-status-current-format its
# own way (arrow-wrapped) at load, so this re-asserts our rounded gold pill + badge on
# top. (The before-TPM run + @minimal-tmux-window-status-format above already keep the
# non-current windows safe/rounded and prevent the plugin's dangerous #(ps) default.)
run-shell 'bash ~/.config/tmux/machine_badge.sh'

# Window status — #I|#W gives "7|claude|.alfred" matching Raycast display
# tmux status: "7|cmd|dir" — built from pane variables, independent of #W
# #W stores full format for Raycast: "claude (~/.alfred)"
# Status bar ignores #W and builds its own short format
#
# SAFETY: Never use #() in window-status-format/window-status-current-format. It forks
# a shell per window, per redraw (not just on status-interval — any pane activity triggers
# a redraw), which on macOS hits the same job_get_event fork crash as automatic-rename-format
# above. Crashed 2026-02-21 and again 2026-05-26 from the #(ps|grep|sed) ssh-hostname lookup
# below. Exceptions in this config, both in status-right: continuum_save.sh (autosave, restores
# sessions after a crash) and morbid_year all (date counters). Both fork once per status-interval,
# serialized — not per-window — so they can't produce the concurrent burst that causes the race.
#
# PREVIOUSLY (DANGEROUS — DO NOT RE-ENABLE, forked #(ps -t #{pane_tty} -o args= | grep "^ssh " | sed "s/.* //") per window per redraw):
# setw -g window-status-format " #I│#{?#{m:ssh*,#{pane_current_command}},#(ps ...),#{?#{m:[0-9]*,#{pane_current_command}},claude,...}}│#{b:pane_current_path} "
# SSH windows now show "ssh" (the command) instead of the parsed remote hostname
# NOTE: the window pills (rounded caps + zoom glyph) are now set by machine_badge.sh
# (octal-safe glyphs — see the badge run-shell above). Kept here, commented, as the
# crash-safe pure-format reference. The rule still holds: NO #() in either format.
# setw -g window-status-format " #I│#{?#{m:[0-9]*,#{pane_current_command}},claude,#{?#{m:codex*,#{pane_current_command}},codex,#{pane_current_command}}}│#{b:pane_current_path} "
# setw -g window-status-current-format "#[fg=#E6C384]#[bg=#E6C384,fg=#1F1F28] #I│#{?#{m:[0-9]*,#{pane_current_command}},claude,#{?#{m:codex*,#{pane_current_command}},codex,#{pane_current_command}}}│#{b:pane_current_path} #{?window_zoomed_flag, 󰊓 ,}#[fg=#E6C384,bg=default]"

# Blank line between status bar and pane content (guard prevents double-apply on reload)
if -F '#{!=:#{status},2}' {
  set -g 'status-format[1]' ''
  set -g status 2
}
}


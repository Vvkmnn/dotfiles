# bind-key ` join-pane -h -s '!'
# bind-key \~ choose-window "join-pane -h -t "%%""

# bind-key j join-pane -h -s '!'
# bind-key k break-pane

bind-key C-j join-pane -h -s '!'
bind-key C-h choose-window "join-pane -h -t "%%""

# break out pane into window (default, <C-b>!)
# bind-key ! break-pane, default
bind-key C-k break-pane

# bind-key @ join-pane -h -t '!'
# bind-key @ choose-window "join-pane -h -s "%%""

# create new split window at path
bind-key C-l split-window -h -c "#{pane_current_path}"


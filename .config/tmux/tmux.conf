# Quick new session
bind-key N new-session

# Arrow keys for moving windows (reordering)
bind-key Left swap-window -t -1\; select-window -t -1
bind-key Right swap-window -t +1\; select-window -t +1

# bind-key r source-file "~/.config/tmux/tmux.conf" # reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded..."

# Global toggle for OpenCode pane: if in Neovim send <C-.>, otherwise jump back (ref: https://github.com/NickvanDyke/opencode.nvim#provider)
bind-key -n C-. if-shell "$is_vim" "send-keys C-." "select-pane -l"

# Quit server
# bind-key C-Q confirm-before -p "kill tmux server? (y/n)" kill-server

# Quit Window
bind-key C-Q confirm-before -p "kill window? (y/n)" kill-pane
# bind-key C-E confirm-before -p "kill window? (y/n)" kill-pane

# Quit session
# bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind-key Q confirm-before -p "kill session #S? (y/n)" kill-session
bind-key K confirm-before -p "kill tmux server (#{session_attached} active sessions)? (y/n)" kill-server

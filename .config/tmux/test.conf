### tmux

## options
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set-option -gw xterm-keys on

set-window-option -g automatic-rename on # Automatically set window title
set-option -g set-titles on

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g mouse on
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 10000       # increase history size (from 2,000)
# set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -sg escape-time 0            # no delay for esc
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g status-keys vi
set -g monitor-activity on        # if change show in command line


set -g pane-active-border-style 'fg=white,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g status-bg default
set -g status-fg white



# Find link And open
# https://www.reddit.com/r/tmux/comments/sv6skh/comment/hxj5zq4/?utm_source=share&utm_medium=web3x&utm_name=web3xcss&utm_term=1&utm_content=share_button
bind-key C-o run-shell -b "tmux capture-pane -J -p | grep -oE '(https?):\/\/.*[^>]' | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open" # \; display-message "Config reloaded..."

## keybinds

# bind-key r source-file "~/.config/tmux/tmux.conf" # reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded..."

# Quit session
# bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind-key Q confirm-before -p "kill session #S? (y/n)" kill-session
bind-key K confirm-before -p "kill tmux server (#{session_attached} active sessions)? (y/n)" kill-server
# bind-key Q kill-session


# navigation
# NOTE add -r if want to repeat
# bind -r h select-pane -L
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# switch panes
bind-key -r Tab select-pane -t :.+

# join and remove panes

set -g status-interval 60
set -g status-left-length 30

set -g status-left '#[fg=orangej(#S) #(whoami)'
set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'


# if tpm
if-shell "[ -d $HOME/.tmux/plugins/tpm ]" {
# TPM_PATH="$HOME/.tmux/plugins/tpm" # if-shell "[ -d '$TPM_PATH' ]" {}

set -g @plugin 'tmux-plugins/tpm'


# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'niksingh710/minimal-tmux-status'
# set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

# TODO what does this do?
set -g @plugin 'laktak/extrakto'

# Here k0 is the length of the characters in the string
set -g status-right-length 60
set -g status-left-length 30


set -g @minimal-tmux-status-left-extra " #{@random_animal} "
bind-key C-a "run-shell -b 'bash ~/.config/tmux/random_animal.sh'"

set -g @minimal-tmux-status-right-extra "\
[fg=#689DDA]#(~/.config/tmux/morbid_year day_of_week) \
[fg=#7A9FDB]#(~/.config/tmux/morbid_year day_of_month) \
[fg=#8CB0DC]#(~/.config/tmux/morbid_year day_of_year) \
[fg=#9EC2DD]#(~/.config/tmux/morbid_year week_of_year) \
[fg=#B0D3DE]#(~/.config/tmux/morbid_year current_month) \
[fg=#C3E5DF]#(~/.config/tmux/morbid_year year_week_based) \
[fg=#FFFFFF]#(~/.config/tmux/morbid_year time) "



set -g @minimal-tmux-justify "left"
# set -g @minimal-tmux-indicator-str " -_- "





set-hook -g session-created "run-shell 'bash ~/.config/tmux/random_animal.sh'"

# set-hook -g window-renamed "run-shell 'bash ~/.config/tmux/random_animal.sh'"
# set-hook -g pane-focus-in "run-shell 'bash ~/.config/tmux/random_animal.sh'"


set -g @minimal-tmux-indicator-str " v#S "

# set -g @minimal-tmux-indicator-str "[#(TZ="America/New_York" kate +"%%Y-%%m-%%d %%H:%%M")]"
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "top"

# Enables or disables the left and right status bar
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true

# expanded icon (fullscreen icon)
set -g @minimal-tmux-expanded-icon " 󰊓 "

#on all tabs (default is false)
# false will make it visible for the current tab only
set -g @minimal-tmux-show-expanded-icons-for-all-tabs true


run '~/.tmux/plugins/tpm/bin/update_plugins all'
run '~/.tmux/plugins/tpm/bin/install_plugins'
run '~/.tmux/plugins/tpm/bin/clean_plugins'
run '~/.tmux/plugins/tpm/tpm'
}
